name: Build SDK

on:
  workflow_call:
    inputs:
      run-tests:
        description: "Run sdkcraft tests after building (requires tests/ directory)."
        required: false
        type: boolean
        default: true
      runs-on:
        description: "JSON array of runner labels."
        required: false
        type: string
        default: '["self-hosted","linux","jammy","x64","xlarge"]'

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install sdkcraft
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 10
          command: sudo snap install sdkcraft --edge --classic

      - name: Pack SDK
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 120
          command: sdkcraft pack

      - name: Run tests
        if: inputs.run-tests
        run: |
          if [ -f tests/spread.yaml ]; then
            sdkcraft --verbose test
          else
            echo "No tests/spread.yaml found – skipping."
          fi
