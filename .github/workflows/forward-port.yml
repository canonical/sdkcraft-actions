name: Forward-Port from Main

on:
  workflow_call:
    inputs:
      long-term-branches:
        description: 'JSON array of version branches to forward-port main into, e.g. ["1.24","1.25","1.26"]'
        required: true
        type: string

jobs:
  forward-port:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      matrix:
        branch: ${{ fromJson(inputs.long-term-branches) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Open forward-port PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.branch }}
        run: |
          # A dedicated head branch keeps conflict resolution off the protected main.
          HEAD_BRANCH="forward-port/main-to-${BRANCH}"

          if [[ $(gh pr list --head "$HEAD_BRANCH" --base "$BRANCH" --json number --jq 'length') -gt 0 ]]; then
            echo "Forward-port PR already open for ${BRANCH}, skipping."
            exit 0
          fi

          git push --force origin "HEAD:refs/heads/${HEAD_BRANCH}"

          gh pr create \
            --head "$HEAD_BRANCH" \
            --base "$BRANCH" \
            --title "chore: forward-port from main to ${BRANCH}" \
            --body "Forward-port of \`main\` into \`${BRANCH}\`. Resolve any conflicts by pushing to \`${HEAD_BRANCH}\`, then merge with a merge commit." \
            --reviewer "${{ github.actor }}"
