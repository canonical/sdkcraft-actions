name: Renovate check

on:
  workflow_call:
    inputs:
      enable_ssh_access:
        type: boolean
        description: "Enable ssh access"
        required: false
        default: false
    secrets:
      token:
        description: "GitHub token or PAT. Use a PAT with repo scope for internal repositories."
        required: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install renovate
        run: npm install --global re2 renovate
      - name: Enable ssh access
        uses: mxschmitt/action-tmate@v3
        if: ${{ inputs.enable_ssh_access }}
        with:
          limit-access-to-actor: true
      - name: Check renovate config
        run: renovate-config-validator renovate.json
      - name: Renovate dry-run
        run: renovate --dry-run=full --autodiscover --print-config
        env:
          RENOVATE_TOKEN: ${{ secrets.token || github.token }}
