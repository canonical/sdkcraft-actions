name: Renovate

on:
  workflow_call:
    secrets:
      token:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Renovate
        uses: renovatebot/github-action@v43.0.12
        with:
          configurationFile: renovate.json
          token: ${{ secrets.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
