name: Forward-Port from Main

on:
  workflow_call:
    inputs:
      long-term-branches:
        description: 'JSON array of version branches to forward-port main into, e.g. ["1.24","1.25","1.26"]'
        required: true
        type: string

jobs:
  forward-port:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ${{ fromJson(inputs.long-term-branches) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - name: Open forward-port PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA=$(git rev-parse --short origin/main)
          if [[ $(gh pr list --head main --base "${{ matrix.branch }}" --json number --jq 'length') -gt 0 ]]; then
            echo "Forward-port PR already open for ${{ matrix.branch }}, skipping."
            exit 0
          fi
          gh pr create \
            --head main \
            --base "${{ matrix.branch }}" \
            --title "chore: forward-port from main to ${{ matrix.branch }}" \
            --body "Forward-port of \`main\` (${MAIN_SHA}) into \`${{ matrix.branch }}\`."
