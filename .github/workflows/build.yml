name: Build SDK

on:
  workflow_call:
    inputs:
      run-tests:
        description: "Run sdkcraft tests after building (requires tests/ directory)."
        required: false
        type: boolean
        default: true
      runs-on:
        description: "JSON array of runner labels."
        required: false
        type: string
        default: '["self-hosted","linux","jammy","x64","xlarge"]'
      test-disk-size:
        description: "Size of VM root disk for running tests"
        required: false
        type: string
        default: '20GiB'
      actions-upload-artifact:
        description: "Upload the resulting .sdk file as a GitHub Actions artifact."
        required: false
        type: boolean
        default: false


jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v6
      - name: Install LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 6/stable

      - name: Install sdkcraft
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 10
          command: sudo snap install sdkcraft --edge --classic

      - name: Pack SDK
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 120
          command: sdkcraft pack

      - name: Run tests
        if: inputs.run-tests
        run: |
          if [ -f tests/spread.yaml ]; then
            lxc profile device set default root size="$INPUT_TEST_DISK_SIZE"
            sdkcraft --verbose test
          else
            echo "No tests/spread.yaml found – skipping."
          fi
        env:
          INPUT_TEST_DISK_SIZE: ${{ inputs.test-disk-size }}

      - name: Upload SDK as GitHub Actions artifact
        if: inputs.actions-upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk
          path: "*.sdk"
